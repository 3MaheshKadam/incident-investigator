name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      # Smoke eval: the rule-based baseline must run every scenario end to end. It is a floor and
      # a pipeline check, not a model result.
      - run: python -m evals.baseline
      - run: python -m evals.baseline --data scenarios/recorded
      - run: python -m evals.detect_eval --split all
      # Real processes (HTTP services + SQLite): two faults must be detected, no false alarm.
      - run: python -m target.run --kinds dependency_outage,bad_deploy --variants 0 --healthy 0 --samples 100 --rows 300000 --require-detected
      # Deployment files must have no high-severity findings (see readiness/).
      - run: python -m readiness . --fail-on high
      - name: Scenario data is up to date
        run: |
          python -m scenarios.generate
          git diff --exit-code scenarios/data
          python -m monitor.record
          git diff --exit-code scenarios/recorded
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t incident-investigator .
