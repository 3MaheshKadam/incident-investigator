[project]
name = "incident-investigator"
version = "0.1.0"
description = "AI on-call agent that investigates simulated production incidents, with a prompt-injection attack and defense layer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ui = ["streamlit>=1.35"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "evals", "gateway", "guard", "monitor", "readiness", "scenarios", "shop", "target", "ui"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"guard/attacks.py" = ["ISC004"]  # long attack strings are split across lines on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
